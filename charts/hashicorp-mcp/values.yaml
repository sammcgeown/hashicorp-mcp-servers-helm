# Global ingress configuration for all MCP servers
ingress:
  enabled: true
  ingressClassName: traefik
  host: mcp.example.com
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-production
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tls:
    enabled: true
    secretName: hashicorp-mcp-tls

# Gateway API HTTPRoute configuration (mutually exclusive with ingress)
httproute:
  enabled: false
  annotations: {}
  hostnames:
    - mcp.example.com
  # parentRefs specifies which Gateway(s) this HTTPRoute attaches to
  parentRefs:
    - name: my-gateway
      namespace: ""        # leave empty to use the same namespace
      # sectionName: ""    # optional: target a specific listener on the gateway
  # gateway: deploy a new Gateway resource alongside the HTTPRoute
  gateway:
    create: false
    name: ""               # defaults to <fullname>-gateway when empty
    annotations: {}
    gatewayClassName: ""   # required when gateway.create is true (e.g. "cilium", "istio", "kong")
    listeners:
      - name: http
        protocol: HTTP
        port: 80

# Certificate configuration (if using cert-manager)
certificate:
  enabled: false
  name: hashicorp-mcp-tls
  commonName: mcp.example.com
  issuer:
    name: letsencrypt-production
    kind: ClusterIssuer

# Terraform MCP Server subchart configuration
terraform-mcp:
  enabled: true
  # Path prefix for routing to this service
  path: /terraform
  # Override subchart values
  replicaCount: 3
  # Container image configuration
  image:
    repository: hashicorp/terraform-mcp-server
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  # Ingress is disabled on subchart - parent chart handles routing
  ingress:
    enabled: false
  tls:
    mount: true
    secretName: hashicorp-mcp-tls
  tfeSecret:
    create: false
    name: tfe-token-secret
  env:
    TFE_ADDRESS: "https://app.terraform.io"
    TFE_SKIP_TLS_VERIFY: "false"
    LOG_LEVEL: "info"
    LOG_FORMAT: "text"
    TRANSPORT_MODE: "streamable-http"
    TRANSPORT_HOST: "0.0.0.0"
    TRANSPORT_PORT: "8080"
    MCP_ENDPOINT: "/mcp"
    MCP_KEEP_ALIVE: "0"
    MCP_SESSION_MODE: "stateless"
    MCP_ALLOWED_ORIGINS: ""
    MCP_CORS_MODE: "strict"
    MCP_RATE_LIMIT_GLOBAL: "10:20"
    MCP_RATE_LIMIT_SESSION: "5:10"
    ENABLE_TF_OPERATIONS: "false"
    OTEL_METRICS_ENABLED: "false"
    OTEL_METRICS_SERVICE_VERSION: "latest"
    OTEL_METRICS_SERVICE_NAME: "terraform-mcp-server"
    OTEL_METRICS_EXPORT_INTERVAL: "2"
    OTEL_METRICS_ENDPOINT: "localhost:4318"
  livenessProbe:
    path: /health
    port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    path: /health
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

# Vault MCP Server subchart configuration
vault-mcp:
  enabled: true
  # Path prefix for routing to this service
  path: /vault
  # Override subchart values
  replicaCount: 3
  # Container image configuration
  image:
    repository: hashicorp/vault-mcp-server
    tag: "0.2.0"
    pullPolicy: IfNotPresent
  # Ingress is disabled on subchart - parent chart handles routing
  ingress:
    enabled: false
  tls:
    mount: true
    secretName: hashicorp-mcp-tls
  vaultSecret:
    create: false
    name: vault-token-secret
  env:
    VAULT_ADDR: "https://vault.example.com"
    TRANSPORT_MODE: "streamable-http"
    MCP_ENDPOINT: "/mcp"
